<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>棒球隊系統</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #1f1e1d; }
    button { padding: 10px 16px; font-size: 16px; border-radius: 8px; border: 0; background: #1f3a5f; color: #fff; cursor: pointer; }
    button.secondary { background: #e5e3dc; color: #1f1e1d; }
    input, select { padding: 8px; font-size: 16px; margin: 4px 0; width: 100%; box-sizing: border-box; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin: 16px 0; }
    ul { padding-left: 20px; }
  </style>
</head>
<body>
  <h1>⚾ 棒球隊系統</h1>
  <p id="user-info">載入中…</p>
  <button id="btn-logout" class="secondary">登出</button>

  <div class="card">
    <h2>球員名單</h2>
    <ul id="player-list"></ul>
  </div>

  <div class="card" id="coach-only" hidden>
    <h2>新增球員（教練）</h2>
    <form id="player-form">
      <input name="name" placeholder="姓名" required>
      <input name="number" type="number" placeholder="背號" required>
      <input name="positions" placeholder="可守位置，逗號分隔，例如 SS,2B">
      <select name="bats"><option value="R">右打</option><option value="L">左打</option><option value="S">左右開弓</option></select>
      <select name="throws"><option value="R">右投</option><option value="L">左投</option></select>
      <button type="submit">新增</button>
    </form>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
