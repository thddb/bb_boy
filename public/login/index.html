<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入｜棒球隊系統</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f4ef; color: #1f1e1d; margin: 0;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .box { background: #fff; border-radius: 16px; padding: 32px 24px; width: min(360px, 90vw);
           text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { color: #6b6a68; margin: 0 0 24px; }
    button { width: 100%; padding: 12px 16px; font-size: 16px; border-radius: 8px; border: 0;
             background: #1f3a5f; color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    #msg { color: #b3261e; margin-top: 16px; min-height: 1.4em; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>⚾ 棒球隊系統</h1>
    <p>請使用 Google 帳號登入</p>
    <button id="btn-login">使用 Google 登入</button>
    <div id="msg"></div>
  </div>
  <script type="module" src="/login/login.js"></script>
</body>
</html>
